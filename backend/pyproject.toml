[project]
name = "smartcut-backend"
version = "0.1.0"
description = "SmartCut AI FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "supabase>=2.9",
    "pyjwt[crypto]>=2.9",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "gdown>=5.2",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
